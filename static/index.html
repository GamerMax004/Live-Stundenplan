<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live-Stundenplan</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e2e5ea;--ac:#3a6d9e;--ac2:#4f8f3c;--ent:#fee2e2;--entt:#b91c1c;--ver:#fef3c7;--vert:#92400e;--rau:#dbeafe;--raut:#1e40af}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1e24;--tx:#e8eaed;--mu:#9aa1ab;--bd:#2c323a;--ac:#6fa3d6;--ac2:#7cbf66;--ent:#4c1d1d;--entt:#fca5a5;--ver:#4a3510;--vert:#fcd34d;--rau:#1e3a5f;--raut:#93c5fd}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1e24;--tx:#e8eaed;--mu:#9aa1ab;--bd:#2c323a;--ac:#6fa3d6;--ac2:#7cbf66;--ent:#4c1d1d;--entt:#fca5a5;--ver:#4a3510;--vert:#fcd34d;--rau:#1e3a5f;--raut:#93c5fd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;padding:12px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:7px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:var(--ac);color:var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.nav{min-width:38px;padding:7px 10px}
button.g{border-color:var(--ac2);color:var(--ac2)}button.g:hover{background:var(--ac2);color:#fff}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.p:hover{filter:brightness(1.08);color:#fff}
.wk{font-weight:600;min-width:150px;text-align:center}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);padding:5px 6px;vertical-align:top;font-size:13px}
th{background:var(--bg);font-size:12px;color:var(--mu)}th.today{color:var(--ac);border-bottom:2px solid var(--ac)}
td.h{width:28px;text-align:center;color:var(--mu);font-weight:600}
.c b{display:block;text-transform:uppercase}.c small{color:var(--mu)}
.c.ent{background:var(--ent)}.c.ent b{text-decoration:line-through;color:var(--entt)}
.c.ver{background:var(--ver)}.c.rau{background:var(--rau)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 4px;margin-top:2px}
.ent .tag{color:var(--entt)}.ver .tag{color:var(--vert)}.rau .tag{color:var(--raut)}
.c .inf{font-size:11px;margin-top:2px}
#st{font-size:12px;color:var(--mu);margin-top:6px}
</style></head><body>
<h1>Mein Stundenplan</h1>
<div class="sub">Hollenberg-Gymnasium · <span id="upd">noch keine Vertretungsdaten geladen</span></div>
<div class="bar">
<button class="nav" id="prev" aria-label="Vorherige Woche">‹</button><div class="wk" id="wk"></div><button class="nav" id="next" aria-label="Nächste Woche">›</button><button class="g" id="now">Heute</button>
<button class="p" id="reload">Aktualisieren</button>
</div>
<div class="wrap"><table id="tt"></table></div>
<div id="st"></div>

<script>
const PLAN={
1:["ph/1|Str|29","ph/1|Str|29","m/2|Fri|506","m/2|Fri|506","ge/2|Mrx|407","ge/2|Mrx|407","","sp/3|Ths|Hei3","sp/3|Ths|Hei3"],
2:["if/2|Stü|500","ph/1|Str|28","sw/1|Stl|419","sw/1|Stl|419","ch/2|Sdr|31","ch/2|Sdr|31","e5/2|Sum|509","",""],
3:["d/1|Gsn|406","d/1|Gsn|406","bi/3|Smi|24","bi/3|Smi|24","m/2|Fri|506","ge/2|Mrx|407","sw/1|Stl|419","",""],
4:["er/1|Mar|415","er/1|Mar|415","if/2|Stü|500","if/2|Stü|500","mu/1|Smt|73","mu/1|Smt|73","","",""],
5:["bi/3|Smi|21","e5/2|Sum|509","e5/2|Sum|509","mu/1|Smt|72","er/1|Mar|415","d/1|Gsn|406","ch/2|Sdr|31","",""]};
const TAGE=["Mo","Di","Mi","Do","Fr"];
let S=null;try{S=JSON.parse(localStorage.getItem("sp")||"null")}catch(e){}
S=S||{url:"",usr:"",pw:"",items:[],upd:""};
if(S.v!==2){S.v=2;S.stufe="EF";if(!S.url||/hollenberg/.test(S.url))S.url="/api/vertretung"} // Umstellung auf EF + eigenen Proxy
S.stufe=S.stufe||"EF";if(!S.url)S.url="/api/vertretung";
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const save=()=>{try{localStorage.setItem("sp",JSON.stringify(S))}catch(e){}};
const thisWeek=()=>{const d=new Date();if(d.getDay()===6||d.getDay()===0)d.setDate(d.getDate()+2);return monday(d)}; // am Wochenende: nächste Woche
let mon=thisWeek();
function monday(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
const fmt=d=>d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
const key=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const norm=s=>(s||"").toLowerCase().replace(/[^a-zäöüß0-9]/g,"");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function hours(s){s=String(s||"");const m=s.match(/(\d+)\s*[-–bis]+\s*(\d+)/);if(m){const a=+m[1],b=+m[2],r=[];for(let i=a;i<=b;i++)r.push(i);return r}const n=s.match(/\d+/g);return n?n.map(Number):[]}
function dayOf(it){ // -> {idx, date|null}
 const t=String(it.datum||it.tag||"");
 const m=t.match(/(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?/);
 if(m){const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):mon.getFullYear();const d=new Date(y,+m[2]-1,+m[1]);return{idx:(d.getDay()+6)%7,date:d}}
 const i=TAGE.findIndex(x=>t.toLowerCase().includes(x.toLowerCase()));return{idx:i,date:null}}
function type(it){const a=norm(it.art);
 if(/entfall|freisetz/.test(a))return"ent";
 if(/raum/.test(a))return"rau";
 return"ver"}
function match(it,day,h,c){
 if(!it.klasse)return false;
 const ks=String(it.klasse).replace(/[()]/g,"").split(/[,\s]+/).map(norm);
 if(!ks.includes(norm(S.stufe||"EF")))return false;
 const d=dayOf(it);if(d.idx!==day)return false;
 if(d.date&&key(d.date)!==key(addD(mon,day)))return false;
 if(!hours(it.stunde).includes(h))return false;
 const f=subj(it.orig)||subj(it.fach);return !!f&&f===subj(c.split("/")[0])}
const subj=s=>(String(s||"").trim().toLowerCase().match(/^[a-zäöüß]+/)||[""])[0]; // "PH-GK1"/"ph1" -> "ph"

function render(){
 const fr=addD(mon,4),today=key(new Date());
 document.getElementById("wk").textContent=fmt(mon)+" – "+fmt(fr)+fr.getFullYear();
 let h="<tr><th></th>";
 TAGE.forEach((t,i)=>{const d=addD(mon,i);h+=`<th class="${key(d)===today?"today":""}">${t} ${fmt(d)}</th>`});
 h+="</tr>";
 for(let p=1;p<=9;p++){h+=`<tr><td class="h">${p}</td>`;
  for(let d=0;d<5;d++){const c=PLAN[d+1][p-1];if(!c){h+="<td></td>";continue}
   const [k,l,r]=c.split("|");const it=S.items.find(x=>match(x,d,p,c));let cls="",tag="",r2=r,l2=l,inf="";
   if(it){cls=type(it);if(cls==="ent")tag="ENTFALL";else if(cls==="rau"){tag="RAUM";r2=it.raum||r}else{tag="VERTRETUNG";l2=it.vertreter||it.lehrer||l;if(it.raum)r2=it.raum}
    inf=it.info||""}
   h+=`<td class="c ${cls}"><b>${esc(k)}</b><small>${esc(l2)} · ${esc(r2)}</small>${tag?`<span class="tag">${tag}</span>`:""}${inf?`<div class="inf">${esc(inf)}</div>`:""}</td>`}
  h+="</tr>"}
 document.getElementById("tt").innerHTML=h;
 document.getElementById("upd").textContent=S.upd?"Vertretungsdaten: "+S.upd:"noch keine Vertretungsdaten geladen"}

function mapRow(o){const r={};for(const k in o){const n=norm(k),v=o[k];
 if(/datum|^tag$|day|date/.test(n))r.datum=v;else if(/stunde|std|zeit|hour/.test(n))r.stunde=v;
 else if(/vertret|vertr|lehrer|lehrkraft|teacher|neu/.test(n))r.vertreter=v;
 else if(/fach|subject|kurs/.test(n)&&!r.fach)r.fach=v;else if(/raum|room/.test(n))r.raum=v;
 else if(/^art|typ|type/.test(n))r.art=v;else if(/info|text|bemerk|hinweis|note/.test(n))r.info=v}return r}
function parseUntis(html){const doc=new DOMParser().parseFromString(html,"text/html"),out=[];
 doc.querySelectorAll("table.subst tr").forEach(tr=>{const c=[...tr.querySelectorAll("td")].map(x=>x.textContent.replace(/\u00a0/g," ").trim());
  if(c.length<9)return;const cl=v=>v==="---"?"":v;
  out.push({klasse:c[0],datum:c[1],stunde:c[2],vertreter:cl(c[3]),fach:cl(c[4]),raum:cl(c[5]),orig:c[6],info:c[7],art:c[8]})});return out}
function parseText(t){t=t.trim();if(!t)return[];
 if(t[0]==="{"||t[0]==="["){try{let j=JSON.parse(t);if(j&&j.files)return j.files.flatMap(parseUntis);if(!Array.isArray(j))j=j.items||j.data||Object.values(j).find(Array.isArray)||[];return j.map(mapRow)}catch(e){}}
 if(t.startsWith("<")||t.includes("<table"))return parseUntis(t);
 return fromRows(t.split(/\r?\n/).map(l=>l.split(/\t|;/).map(s=>s.trim())))}
function fromRows(rows){rows=rows.filter(r=>r.some(Boolean));if(rows.length<2)return[];const hd=rows[0];
 return rows.slice(1).map(r=>{const o={};hd.forEach((k,i)=>o[k]=r[i]);return mapRow(o)})}
function setSt(m){document.getElementById("st").textContent=m}
let busy=false;
async function load(force){if(!S.url){setSt("Keine Datenquelle eingetragen.");return}
 if(busy)return;busy=true;setSt("Lade aktuelle Vertretungsdaten …");
 try{const h={};if(S.usr)h.Authorization="Basic "+btoa(unescape(encodeURIComponent(S.usr+":"+S.pw)));
  const u=S.url+(force===true&&S.url.startsWith("/api/")?"?force=1":"");
  const r=await fetch(u,{headers:h,cache:"no-store"});
  if(r.status===401)throw new Error("Der Vertretungsplan der Schule ist passwortgeschützt – Zugangsdaten fehlen oder sind falsch.");
  const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||"HTTP "+r.status);
  S.items=parseText(t);S.upd=(j&&j.stand?"Stand Schule "+j.stand+" · ":"")+"abgerufen "+new Date().toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})+(j&&j.stale?" (Schule gerade nicht erreichbar, letzte Daten)":"");
  save();const mine=S.items.filter(x=>norm(String(x.klasse).replace(/[()]/g,"")).includes(norm(S.stufe))).length;
  setSt(S.items.length+" Einträge geladen, davon "+mine+" für "+S.stufe+".");render()}
 catch(e){setSt("Abruf fehlgeschlagen: "+e.message)}finally{busy=false}}
const $=id=>document.getElementById(id);
$("prev").onclick=()=>{mon=addD(mon,-7);render()};
$("next").onclick=()=>{mon=addD(mon,7);render()};
$("now").onclick=()=>{mon=thisWeek();render()};
$("reload").onclick=()=>load(true);
render();if(S.url){load();setInterval(load,300000)}
// beim Zurückkehren zur Seite/App sofort neu laden
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
addEventListener("pageshow",e=>{if(e.persisted)load()});
</script></body></html>
